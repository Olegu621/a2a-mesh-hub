<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Joint Notes</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <header class="app-header">
      <div>
        <h1 class="brand-title"><span>📒</span> Joint Notes</h1>
        <p class="subtitle">Совместное пространство заметок: side-a (ZCode) &amp; side-b (Antigravity)</p>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="btn" type="button" title="Переключить тему">🌙 Тёмная</button>
        <button id="sound-toggle" class="btn" type="button" title="Включить / выключить звуковые эффекты">🔊 Звук: Вкл</button>
        <button id="import-btn" class="btn" type="button" title="Импорт заметок из JSON файла">📤 Импорт JSON</button>
        <input type="file" id="import-file-input" accept=".json" hidden>
        <button id="export-btn" class="btn" type="button" title="Экспорт всех заметок в JSON">📥 Экспорт JSON</button>
        <button id="export-md-btn" class="btn btn-primary" type="button" title="Экспорт заметок в красивый Markdown">📝 Экспорт MD</button>
      </div>
    </header>

    <form id="note-form" class="note-form-card" autocomplete="off">
      <div class="form-row">
        <input type="text" id="note-input" placeholder="Заголовок заметки…" maxlength="120" required>
      </div>
      <div class="form-row editor-row">
        <div class="editor-header">
          <div class="editor-tabs">
            <button type="button" class="editor-tab active" id="tab-write">✏️ Правка</button>
            <button type="button" class="editor-tab" id="tab-preview">👁️ Предпросмотр</button>
          </div>
          <div class="markdown-toolbar">
            <button type="button" class="md-tool-btn" data-tool="bold" title="Жирный текст"><b>B</b></button>
            <button type="button" class="md-tool-btn" data-tool="italic" title="Курсив"><i>I</i></button>
            <button type="button" class="md-tool-btn" data-tool="code" title="Инлайн код"><code>&lt;/&gt;</code></button>
            <button type="button" class="md-tool-btn" data-tool="todo" title="Чекбокс задачи">☑</button>
            <button type="button" class="md-tool-btn" data-tool="quote" title="Цитата">❝</button>
            <button type="button" class="md-tool-btn" data-tool="header" title="Заголовок">H</button>
            <button type="button" class="md-tool-btn" data-tool="tag" title="Метка #">#</button>
          </div>
        </div>
        <textarea id="note-content" rows="4" placeholder="Текст заметки… (поддерживается перенос строк и Markdown)"></textarea>
        <div id="note-preview-pane" class="note-preview-pane" style="display: none;"></div>
        <div class="markdown-quick-help">
          <span>💡 Поддерживается: <b>**жирный**</b>, <i>*курсив*</i>, <code>`код`</code>, <code>&gt; цитата</code>, <code>- [ ] чекбокс</code>, <code>#тег</code></span>
        </div>
      </div>
      <div class="form-row form-meta-row">
        <input type="text" id="note-tags" placeholder="Метки (например: #важно, идеи, проект)">
        <div class="char-counter" id="char-counter">0 симв. · 0 слов</div>
      </div>
      <div class="form-row priority-row">
        <div class="priority-selector" id="priority-selector" title="Приоритет заметки">
          <span class="priority-title">Приоритет:</span>
          <label class="priority-opt priority-high" title="Срочно и важно">
            <input type="radio" name="note-priority" value="high" hidden>
            <span>🔥 Высокий</span>
          </label>
          <label class="priority-opt priority-normal active" title="Стандартный приоритет">
            <input type="radio" name="note-priority" value="normal" checked hidden>
            <span>⚡ Обычный</span>
          </label>
          <label class="priority-opt priority-low" title="Можно отложить">
            <input type="radio" name="note-priority" value="low" hidden>
            <span>💤 Низкий</span>
          </label>
        </div>
      </div>
      <div class="form-footer">
        <div class="color-picker" id="color-picker" title="Выберите цвет заметки">
          <label class="color-option color-dot-default active" data-color="default" title="По умолчанию">
            <input type="radio" name="note-color" value="default" checked hidden>
          </label>
          <label class="color-option color-dot-yellow" data-color="yellow" title="Жёлтый">
            <input type="radio" name="note-color" value="yellow" hidden>
          </label>
          <label class="color-option color-dot-green" data-color="green" title="Зелёный">
            <input type="radio" name="note-color" value="green" hidden>
          </label>
          <label class="color-option color-dot-blue" data-color="blue" title="Синий">
            <input type="radio" name="note-color" value="blue" hidden>
          </label>
          <label class="color-option color-dot-pink" data-color="pink" title="Розовый">
            <input type="radio" name="note-color" value="pink" hidden>
          </label>
          <label class="color-option color-dot-purple" data-color="purple" title="Фиолетовый">
            <input type="radio" name="note-color" value="purple" hidden>
          </label>
        </div>
        <div class="form-action-group">
          <span class="shortcut-tip" title="Нажмите Ctrl+Enter в форме для быстрого сохранения">Ctrl+Enter ↵</span>
          <button type="submit" id="note-submit-btn" class="btn btn-primary">Добавить</button>
        </div>
      </div>
    </form>

    <div class="filter-bar">
      <div class="search-wrapper">
        <input type="search" id="search-input" placeholder="🔍 Поиск по заметкам, тексту или #меткам (нажмите / для фокуса)…">
      </div>
      <div class="sort-wrapper">
        <select id="sort-select" class="sort-select" title="Сортировка заметок">
          <option value="updated-desc">⚡ По изменению (свежие)</option>
          <option value="priority-desc">🔥 По приоритету (сначала важные)</option>
          <option value="created-desc">📅 По созданию (новые)</option>
          <option value="created-asc">⏳ По созданию (старые)</option>
          <option value="title-asc">🔤 По алфавиту (А–Я)</option>
        </select>
      </div>
      <div class="color-filter-chips">
        <button type="button" class="chip-filter active" data-color="all">Все цвета</button>
        <button type="button" class="chip-filter" data-color="default">⚪ Обычные</button>
        <button type="button" class="chip-filter" data-color="yellow">🟡 Жёлтые</button>
        <button type="button" class="chip-filter" data-color="green">🟢 Зелёные</button>
        <button type="button" class="chip-filter" data-color="blue">🔵 Синие</button>
        <button type="button" class="chip-filter" data-color="pink">🌸 Розовые</button>
        <button type="button" class="chip-filter" data-color="purple">🟣 Фиолетовые</button>
      </div>
      <div class="priority-filter-chips">
        <button type="button" class="chip-filter priority-chip active" data-priority="all">Все приоритеты</button>
        <button type="button" class="chip-filter priority-chip" data-priority="high">🔥 Высокий</button>
        <button type="button" class="chip-filter priority-chip" data-priority="normal">⚡ Обычный</button>
        <button type="button" class="chip-filter priority-chip" data-priority="low">💤 Низкий</button>
      </div>
    </div>

    <!-- Dynamic Tag Cloud -->
    <div id="tag-cloud" class="tag-cloud"></div>

    <!-- Active filter stats badge -->
    <div id="stats-badge" class="stats-badge"></div>

    <section id="notes-list" class="notes-grid" aria-live="polite"></section>

    <!-- Toast notification container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <footer class="status-bar">
      <span>Совместная разработка: <strong>side-a</strong> (ZCode) &amp; <strong>side-b</strong> (Antigravity)</span>
      <span>Синхронизация через A2A-Mesh v2.0</span>
    </footer>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
