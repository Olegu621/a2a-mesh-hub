<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joint Notes</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <header class="app-header">
      <div>
        <h1 class="brand-title"><span>📒</span> Joint Notes</h1>
        <p class="subtitle">Совместное пространство заметок: side-a (ZCode) &amp; side-b (Antigravity)</p>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="btn" type="button" title="Переключить тему">🌙 Тёмная</button>
        <button id="import-btn" class="btn" type="button" title="Импорт заметок из JSON файла">📤 Импорт JSON</button>
        <input type="file" id="import-file-input" accept=".json" hidden>
        <button id="export-btn" class="btn btn-primary" type="button" title="Экспорт всех заметок в JSON">📥 Экспорт JSON</button>
      </div>
    </header>

    <form id="note-form" class="note-form-card" autocomplete="off">
      <div class="form-row">
        <input type="text" id="note-input" placeholder="Заголовок заметки…" maxlength="120" required>
      </div>
      <div class="form-row">
        <textarea id="note-content" rows="3" placeholder="Текст заметки… (поддерживается перенос строк)"></textarea>
      </div>
      <div class="form-row form-meta-row">
        <input type="text" id="note-tags" placeholder="Метки (например: #важно, идеи, проект)">
        <div class="char-counter" id="char-counter">0 симв. · 0 слов</div>
      </div>
      <div class="form-footer">
        <div class="color-picker" id="color-picker" title="Выберите цвет заметки">
          <label class="color-option color-dot-default active" data-color="default" title="По умолчанию">
            <input type="radio" name="note-color" value="default" checked hidden>
          </label>
          <label class="color-option color-dot-yellow" data-color="yellow" title="Жёлтый">
            <input type="radio" name="note-color" value="yellow" hidden>
          </label>
          <label class="color-option color-dot-green" data-color="green" title="Зелёный">
            <input type="radio" name="note-color" value="green" hidden>
          </label>
          <label class="color-option color-dot-blue" data-color="blue" title="Синий">
            <input type="radio" name="note-color" value="blue" hidden>
          </label>
          <label class="color-option color-dot-pink" data-color="pink" title="Розовый">
            <input type="radio" name="note-color" value="pink" hidden>
          </label>
          <label class="color-option color-dot-purple" data-color="purple" title="Фиолетовый">
            <input type="radio" name="note-color" value="purple" hidden>
          </label>
        </div>
        <div class="form-action-group">
          <span class="shortcut-tip" title="Нажмите Ctrl+Enter в форме для быстрого сохранения">Ctrl+Enter ↵</span>
          <button type="submit" id="note-submit-btn" class="btn btn-primary">Добавить</button>
        </div>
      </div>
    </form>

    <div class="filter-bar">
      <div class="search-wrapper">
        <input type="search" id="search-input" placeholder="🔍 Поиск по заметкам, тексту или #меткам (нажмите / для фокуса)…">
      </div>
      <div class="sort-wrapper">
        <select id="sort-select" class="sort-select" title="Сортировка заметок">
          <option value="updated-desc">⚡ По изменению (свежие)</option>
          <option value="created-desc">📅 По созданию (новые)</option>
          <option value="created-asc">⏳ По созданию (старые)</option>
          <option value="title-asc">🔤 По алфавиту (А–Я)</option>
        </select>
      </div>
      <div class="color-filter-chips">
        <button type="button" class="chip-filter active" data-color="all">Все</button>
        <button type="button" class="chip-filter" data-color="default">⚪ Обычные</button>
        <button type="button" class="chip-filter" data-color="yellow">🟡 Жёлтые</button>
        <button type="button" class="chip-filter" data-color="green">🟢 Зелёные</button>
        <button type="button" class="chip-filter" data-color="blue">🔵 Синие</button>
        <button type="button" class="chip-filter" data-color="pink">🌸 Розовые</button>
        <button type="button" class="chip-filter" data-color="purple">🟣 Фиолетовые</button>
      </div>
    </div>

    <!-- Active filter stats badge -->
    <div id="stats-badge" class="stats-badge"></div>

    <section id="notes-list" class="notes-grid" aria-live="polite"></section>

    <!-- Toast notification container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <footer class="status-bar">
      <span>Совместная разработка: <strong>side-a</strong> (ZCode) &amp; <strong>side-b</strong> (Antigravity)</span>
      <span>Синхронизация через A2A-Mesh v2.0</span>
    </footer>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
