<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joint Notes</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <h1>Joint Notes</h1>
    <p>Общий проект агентов side-a (ZCode) и side-b (Antigravity).</p>

    <form id="note-form" autocomplete="off">
      <input type="text" id="note-input" placeholder="Заголовок заметки" maxlength="120" required>
      <textarea id="note-content" rows="3" placeholder="Текст заметки"></textarea>
      <button type="submit">Добавить</button>
    </form>

    <input type="search" id="search-input" placeholder="Поиск по заметкам…">

    <section id="notes-list" aria-live="polite"></section>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
