<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>A2A Chat — side-a & side-b</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f13; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
    header { background: #1a1a2e; padding: 16px 24px; border-bottom: 1px solid #2a2a4a; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 18px; font-weight: 600; }
    .badge { background: #16213e; border: 1px solid #0f3460; border-radius: 20px; padding: 4px 12px; font-size: 12px; color: #a0a0c0; }
    .peers { margin-left: auto; display: flex; gap: 8px; }
    .peer { display: flex; align-items: center; gap: 6px; font-size: 13px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .dot.offline { background: #6b6b80; animation: none; }
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .msg { display: flex; gap: 12px; max-width: 72%; }
    .msg.right { align-self: flex-end; flex-direction: row-reverse; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; flex-shrink: 0; }
    .avatar.a { background: #7c3aed; }
    .avatar.b { background: #0891b2; }
    .avatar.sys { background: #374151; font-size: 12px; }
    .bubble { background: #1e1e30; border-radius: 12px; padding: 10px 14px; }
    .msg.right .bubble { background: #1a3a5c; }
    .bubble .meta { font-size: 11px; color: #6b6b90; margin-bottom: 4px; }
    .bubble .text { font-size: 14px; line-height: 1.5; word-break: break-word; }
    .bubble .kind { font-size: 10px; border-radius: 8px; padding: 2px 7px; margin-left: 6px; background: #2a2a4a; color: #8080b0; }
    .kind.status { background: #1a3a1a; color: #4ade80; }
    .kind.question { background: #3a2a1a; color: #fbbf24; }
    .kind.git { background: #1a2a3a; color: #60a5fa; }
    footer { padding: 16px 24px; background: #1a1a2e; border-top: 1px solid #2a2a4a; display: flex; gap: 10px; }
    footer input { flex: 1; background: #0f0f1a; border: 1px solid #2a2a4a; border-radius: 8px; padding: 10px 14px; color: #e0e0e0; font-size: 14px; outline: none; }
    footer input:focus { border-color: #4a4a8a; }
    footer button { background: #4a4a8a; border: none; border-radius: 8px; padding: 10px 20px; color: #fff; cursor: pointer; font-size: 14px; }
    footer button:hover { background: #6060aa; }
    .system-msg { align-self: center; font-size: 12px; color: #5a5a7a; background: #1a1a28; padding: 4px 12px; border-radius: 12px; }
    .tasks-panel { background: #14141f; border-left: 1px solid #2a2a4a; padding: 16px; width: 220px; flex-shrink: 0; overflow-y: auto; }
    .tasks-panel h3 { font-size: 13px; color: #6b6b90; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .task-item { background: #1e1e30; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; font-size: 12px; }
    .task-item .task-title { color: #c0c0e0; margin-bottom: 4px; }
    .task-item .task-meta { color: #6b6b90; }
    .main { display: flex; flex: 1; overflow: hidden; }
    #status-bar { text-align: center; padding: 6px; font-size: 12px; color: #5a5a7a; background: #12121c; }
  </style>
</head>
<body>
  <header>
    <h1>🤖 A2A Mesh Chat</h1>
    <span class="badge">room: main</span>
    <div class="peers">
      <div class="peer"><div class="dot" id="dot-a"></div><span id="label-a">side-a</span></div>
      <div class="peer"><div class="dot" id="dot-b"></div><span id="label-b">side-b</span></div>
    </div>
  </header>
  <div id="status-bar">⏳ Подключение к хабу...</div>
  <div class="main">
    <div id="messages"></div>
    <div class="tasks-panel">
      <h3>Задачи</h3>
      <div id="tasks-list"><div style="color:#4a4a6a;font-size:12px">Нет задач</div></div>
    </div>
  </div>
  <footer>
    <input id="inp" placeholder="Написать в комнату (от человека)..." onkeydown="if(event.key==='Enter')sendMsg()"/>
    <button onclick="sendMsg()">Отправить</button>
  </footer>
  <script>
    const HUB = 'http://localhost:7777';
    let lastId = 0;
    const msgsEl = document.getElementById('messages');
    const tasksEl = document.getElementById('tasks-list');
    const statusBar = document.getElementById('status-bar');

    function avatarFor(name) {
      if (name === 'side-a') return `<div class="avatar a">A</div>`;
      if (name === 'side-b') return `<div class="avatar b">B</div>`;
      return `<div class="avatar sys">👤</div>`;
    }

    function renderMsg(m) {
      if (m.id <= lastId) return;
      lastId = m.id;
      const isB = m.from === 'side-b';
      const kindCls = m.type && m.type !== 'chat' ? ` kind ${m.type}` : '';
      const kindTag = m.type && m.type !== 'chat' ? `<span class="kind ${m.type}">${m.type}</span>` : '';
      const toTag = m.to ? ` → <b>${m.to}</b>` : '';
      const time = new Date(m.ts).toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
      const el = document.createElement('div');
      el.className = `msg ${isB ? 'right' : ''}`;
      el.innerHTML = `${avatarFor(m.from)}<div class="bubble"><div class="meta"><b>${m.from}</b>${toTag}${kindTag} · ${time}</div><div class="text">${escHtml(m.text)}</div></div>`;
      msgsEl.appendChild(el);
      msgsEl.scrollTop = msgsEl.scrollHeight;
    }

    function addSystem(txt) {
      const el = document.createElement('div');
      el.className = 'system-msg';
      el.textContent = txt;
      msgsEl.appendChild(el);
      msgsEl.scrollTop = msgsEl.scrollHeight;
    }

    function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    async function poll() {
      try {
        const r = await fetch(`${HUB}/api/messages?since=${lastId}`);
        const data = await r.json();
        if (data.messages && data.messages.length) {
          data.messages.forEach(renderMsg);
        }
        // update state
        const st = await fetch(`${HUB}/api/state`).then(r=>r.json());
        const names = st.peers.map(p=>p.name);
        document.getElementById('dot-a').className = 'dot' + (names.includes('side-a') ? '' : ' offline');
        document.getElementById('dot-b').className = 'dot' + (names.includes('side-b') ? '' : ' offline');
        statusBar.textContent = `🟢 Хаб онлайн · Пиров: ${names.length || 0} (${names.join(', ') || 'нет'}) · Задач: ${st.tasks.filter(t=>t.status!=='done').length} · Локов: ${st.locks.length}`;

        // tasks
        const open = st.tasks.filter(t=>t.status!=='done');
        tasksEl.innerHTML = open.length
          ? open.map(t=>`<div class="task-item"><div class="task-title">${escHtml(t.title||t.id)}</div><div class="task-meta">${t.assignee||'?'} · ${t.status}</div></div>`).join('')
          : '<div style="color:#4a4a6a;font-size:12px">Нет задач</div>';
      } catch(e) {
        statusBar.textContent = '🔴 Хаб недоступен — ' + e.message;
      }
    }

    async function sendMsg() {
      const inp = document.getElementById('inp');
      const text = inp.value.trim();
      if (!text) return;
      inp.value = '';
      await fetch(`${HUB}/api/send`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({room:'main', token:'', from:'human', to:null, type:'chat', text})
      });
    }

    addSystem('Чат A2A-Mesh запущен');
    poll();
    setInterval(poll, 2000);
  </script>
</body>
</html>
