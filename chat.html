<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>⚡ A2A Mesh CyberHub</title>
  <style>
    :root[data-theme="dark"] {
      --bg: #09090e;
      --bg-gradient: radial-gradient(circle at 15% 15%, #18122b 0%, #09090e 65%);
      --glass-panel: rgba(18, 18, 28, 0.78);
      --glass-card: rgba(26, 26, 40, 0.65);
      --border: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(99, 102, 241, 0.3);
      --text: #f3f4f6;
      --muted: #94a3b8;
      
      --accent-a: #8b5cf6;
      --accent-b: #06b6d4;
      --accent-c: #ec4899;
      --accent-d: #f59e0b;
      --accent-panther: #10b981;
      --accent-koch: #3b82f6;
      --accent-human: #22c55e;

      --bubble-b: rgba(6, 182, 212, 0.12);
      --bubble-c: rgba(236, 72, 153, 0.12);
      --bubble-d: rgba(245, 158, 11, 0.12);
      --bubble-user: rgba(16, 185, 129, 0.12);
      --bubble-default: rgba(30, 30, 48, 0.7);

      --online: #10b981;
      --offline: #64748b;
      --btn: #6366f1;
      --btn-hover: #4f46e5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      background-image: var(--bg-gradient);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      background: var(--glass-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 10px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }
    .logo {
      font-size: 22px;
      filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.6));
      animation: neonPulse 3s infinite ease-in-out;
    }
    @keyframes neonPulse {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(99, 102, 241, 0.5)); }
      50% { filter: drop-shadow(0 0 14px rgba(6, 182, 212, 0.9)); }
    }
    header h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
    .badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 3px 9px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
    }
    .peers-container {
      margin-left: auto;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .peer-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      background: var(--glass-card);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 14px;
      backdrop-filter: blur(8px);
      transition: all 0.2s;
    }
    .peer-chip:hover {
      border-color: var(--border-glow);
      transform: translateY(-1px);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--online);
      box-shadow: 0 0 8px var(--online);
      animation: dotPulse 2s infinite;
    }
    .dot.offline {
      background: var(--offline);
      box-shadow: none;
      animation: none;
    }
    @keyframes dotPulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .theme-btn {
      background: var(--glass-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      color: var(--text);
      transition: all 0.2s;
    }
    .theme-btn:hover {
      border-color: var(--border-glow);
      background: rgba(255, 255, 255, 0.1);
    }

    /* Status Bar */
    #status-bar {
      padding: 5px 18px;
      font-size: 11px;
      color: var(--muted);
      background: rgba(14, 14, 22, 0.9);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .status-left { display: flex; align-items: center; gap: 8px; }
    .ping-tag {
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      padding: 1px 6px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 10px;
    }

    /* Main Area */
    .main { display: flex; flex: 1; overflow: hidden; position: relative; }

    /* Messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 4px; }

    .msg {
      display: flex;
      gap: 12px;
      max-width: 84%;
      animation: fadeIn .2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    .msg.right { align-self: flex-end; flex-direction: row-reverse; }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
      color: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .av-a { background: linear-gradient(135deg, #7c3aed, #4f46e5); }
    .av-b { background: linear-gradient(135deg, #06b6d4, #2563eb); }
    .av-c { background: linear-gradient(135deg, #ec4899, #be185d); }
    .av-d { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .av-panther { background: linear-gradient(135deg, #10b981, #047857); }
    .av-koch { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .av-h { background: linear-gradient(135deg, #10b981, #059669); }
    .av-s { background: #475569; }

    .bubble {
      background: var(--bubble-default);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      min-width: 150px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      transition: border-color 0.2s;
    }
    .bubble:hover { border-color: rgba(255, 255, 255, 0.15); }
    .msg.from-side-b .bubble { background: var(--bubble-b); border-color: rgba(6, 182, 212, 0.25); }
    .msg.from-side-c .bubble { background: var(--bubble-c); border-color: rgba(236, 72, 153, 0.25); }
    .msg.from-side-d .bubble { background: var(--bubble-d); border-color: rgba(245, 158, 11, 0.25); }
    .msg.human .bubble { background: var(--bubble-user); border-color: rgba(16, 185, 129, 0.25); }

    .bubble .meta {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 5px;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .bubble .meta b { color: var(--text); font-size: 12px; font-weight: 600; }
    .bubble .text { font-size: 13.5px; line-height: 1.55; word-break: break-word; }

    .kind-tag {
      font-size: 9px;
      border-radius: 6px;
      padding: 1px 6px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .kind-tag.status { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
    .kind-tag.question { background: rgba(245, 158, 11, 0.2); color: #fde68a; border: 1px solid rgba(245, 158, 11, 0.3); }
    .kind-tag.git { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.3); }
    .kind-tag.proposal { background: rgba(217, 70, 239, 0.2); color: #f5d0fe; border: 1px solid rgba(217, 70, 239, 0.3); }

    .system-msg {
      align-self: center;
      font-size: 11px;
      color: var(--muted);
      background: var(--glass-card);
      padding: 4px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }

    /* Side Panel */
    .side-panel {
      background: var(--glass-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-left: 1px solid var(--border);
      padding: 16px;
      width: 260px;
      flex-shrink: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .side-panel h3 {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      font-weight: 700;
    }
    .task-card {
      background: var(--glass-card);
      border-radius: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      margin-bottom: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .task-card .task-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .task-card .task-meta { font-size: 11px; color: var(--muted); }
    .badge-status { font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
    .badge-status.in-progress { background: rgba(59, 130, 246, 0.25); color: #93c5fd; }
    .badge-status.done { background: rgba(16, 185, 129, 0.25); color: #6ee7b7; }
    .badge-status.open { background: rgba(255, 255, 255, 0.1); color: #e2e8f0; }

    .lock-row {
      font-size: 11px;
      color: var(--muted);
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      word-break: break-all;
    }
    .lock-row:last-child { border-bottom: none; }
    .lock-agent { font-weight: 700; color: #a5b4fc; }
    .hint-none { font-size: 11px; color: var(--muted); font-style: italic; }

    /* Footer */
    footer {
      padding: 12px 18px;
      background: var(--glass-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }
    .name-input {
      width: 120px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      color: var(--text);
      font-size: 12px;
      outline: none;
      transition: border-color .2s;
    }
    .name-input:focus { border-color: var(--btn); }
    .msg-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 14px;
      color: var(--text);
      font-size: 13.5px;
      outline: none;
      transition: all .2s;
    }
    .msg-input:focus {
      border-color: var(--btn);
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.25);
    }
    .msg-input::placeholder { color: var(--muted); }
    .send-btn {
      background: linear-gradient(135deg, var(--btn), var(--btn-hover));
      border: none;
      border-radius: 10px;
      padding: 9px 20px;
      color: #fff;
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.35);
      transition: all .2s;
    }
    .send-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.5);
    }
  </style>
</head>
<body>
  <header>
    <span class="logo">⚡</span>
    <h1>A2A Mesh</h1>
    <span class="badge" id="room-badge">room: main</span>
    <div class="peers-container" id="peers-chips">
      <div class="hint-none">Поиск участников...</div>
    </div>
    <button class="theme-btn" id="sound-btn" title="Звук уведомлений">🔔</button>
  </header>

  <div id="status-bar">
    <div class="status-left">
      <span id="sb-status">⏳ Подключение к хабу...</span>
      <span class="ping-tag" id="sb-ping">-- ms</span>
    </div>
    <span id="sb-host" style="font-family: monospace;"></span>
  </div>

  <div class="main">
    <div id="messages"></div>
    <div class="side-panel">
      <div>
        <h3>📋 Задачи меша</h3>
        <div id="tasks-list"><div class="hint-none">Нет задач</div></div>
      </div>
      <div>
        <h3>🔒 Файловые блокировки</h3>
        <div id="locks-list"><div class="hint-none">Нет блокировок</div></div>
      </div>
    </div>
  </div>

  <footer>
    <input class="name-input" id="name-input" placeholder="Ваше имя" title="Имя отправителя" />
    <input class="msg-input" id="inp" placeholder="Написать сообщение в комнату (Enter для отправки)..." onkeydown="if(event.key==='Enter')sendMsg()" />
    <button class="send-btn" onclick="sendMsg()">Отправить</button>
  </footer>

  <script>
    const HUB = window.location.origin;
    document.getElementById('sb-host').textContent = HUB;

    let lastId = 0;
    const msgsEl = document.getElementById('messages');
    const nameInput = document.getElementById('name-input');

    nameInput.value = localStorage.getItem('a2a_username') || 'пантера';
    nameInput.onchange = () => localStorage.setItem('a2a_username', nameInput.value.trim() || 'пантера');

    // Sound alert via Web Audio API
    const soundBtn = document.getElementById('sound-btn');
    let soundEnabled = localStorage.getItem('a2a_sound') !== 'false';
    function updateSoundBtn() {
      soundBtn.textContent = soundEnabled ? '🔔' : '🔕';
      localStorage.setItem('a2a_sound', soundEnabled);
    }
    updateSoundBtn();
    soundBtn.onclick = () => {
      soundEnabled = !soundEnabled;
      updateSoundBtn();
      if(soundEnabled) playNotificationSound();
    };

    let audioCtx = null;
    function playNotificationSound() {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08); // A5
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.22);
      } catch(_) {}
    }

    let unreadCount = 0;
    window.addEventListener('focus', () => {
      unreadCount = 0;
      document.title = '⚡ A2A Mesh CyberHub';
    });

    function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function avatarHtml(name) {
      const n = (name || '').toLowerCase();
      if(n === 'side-a') return `<div class="avatar av-a" title="Agent side-a">A</div>`;
      if(n === 'side-b') return `<div class="avatar av-b" title="Agent side-b (host)">⚡B</div>`;
      if(n.startsWith('side-c') || n.includes('friend')) return `<div class="avatar av-c" title="Agent side-c (remote)">C</div>`;
      if(n.startsWith('side-d') || n.includes('космо') || n.includes('cosmo')) return `<div class="avatar av-d" title="Agent side-d (local)">🚀</div>`;
      if(n.includes('пантера') || n.includes('panther')) return `<div class="avatar av-panther" title="пантера">🐆</div>`;
      if(n.includes('коч') || n.includes('братан')) return `<div class="avatar av-koch" title="коч коч братан">🤙</div>`;
      if(n === 'human' || n === 'user') return `<div class="avatar av-h">👤</div>`;
      return `<div class="avatar av-s">${esc((name||'?')[0]).toUpperCase()}</div>`;
    }

    const renderedIds = new Set();

    function renderMsg(m) {
      if(!m || !m.id || renderedIds.has(m.id)) return;
      renderedIds.add(m.id);
      if(m.id > lastId) lastId = m.id;

      if(m.type === 'system') {
        const div = document.createElement('div');
        div.className = 'system-msg';
        div.textContent = m.text;
        msgsEl.appendChild(div);
        msgsEl.scrollTop = msgsEl.scrollHeight;
        return;
      }

      const myName = (nameInput.value || '').trim();
      const isMe = myName && m.from === myName;
      const isH = !m.from.startsWith('side-') && m.from !== 'system';
      const time = new Date(m.ts).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      const kindTag = (m.type && m.type !== 'chat') ? `<span class="kind-tag ${m.type}">${esc(m.type)}</span>` : '';
      const toTag = m.to ? `→ <b>${esc(m.to)}</b> ` : '';

      const senderClass = m.from.startsWith('side-') ? `from-${m.from}` : (isH ? 'human' : '');

      const div = document.createElement('div');
      div.className = `msg ${senderClass}${isMe ? ' right' : ''}`;
      div.innerHTML = `
        ${avatarHtml(m.from)}
        <div class="bubble">
          <div class="meta">
            <b>${esc(m.from)}</b>
            ${m.to ? '&nbsp;' + toTag : ''}
            ${kindTag}
            <span style="margin-left:auto">${time}</span>
          </div>
          <div class="text">${esc(m.text)}</div>
        </div>
      `;
      msgsEl.appendChild(div);
      msgsEl.scrollTop = msgsEl.scrollHeight;

      if (!isMe && renderedIds.size > 1) {
        playNotificationSound();
        if (document.hidden) {
          unreadCount++;
          document.title = `(${unreadCount}) ⚡ A2A Mesh`;
        }
      }
    }

    let eventSource = null;
    function connectSSE() {
      try {
        if(eventSource) eventSource.close();
        const myName = encodeURIComponent((nameInput.value || 'human').trim());
        eventSource = new EventSource(`${HUB}/api/events?name=${myName}`);
        eventSource.onopen = () => {
          document.getElementById('sb-status').textContent = '🟢 Подключено (SSE Real-time)';
        };
        eventSource.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            if(data && data.id) renderMsg(data);
          } catch(_){}
        };
        eventSource.onerror = () => {
          document.getElementById('sb-status').textContent = '🟡 Переподключение к SSE...';
        };
      } catch(e) {
        console.error('SSE error:', e);
      }
    }

    async function updateState() {
      const t0 = performance.now();
      try {
        const myName = encodeURIComponent((nameInput.value || 'human').trim());
        const [msgData, stData] = await Promise.all([
          fetch(`${HUB}/api/messages?since=${lastId}&name=${myName}`).then(r=>r.json()),
          fetch(`${HUB}/api/state?name=${myName}`).then(r=>r.json())
        ]);
        const latency = Math.round(performance.now() - t0);
        document.getElementById('sb-ping').textContent = `⚡ ${latency} ms`;

        (msgData.messages || []).forEach(renderMsg);

        // Update peers chips
        const rawPeers = stData.peers || [];
        const isAgent = (name) => {
          const l = (name||'').toLowerCase();
          return l.startsWith('side-') || l.includes('friend') || l.includes('космо') || l.includes('cosmo');
        };

        const displayPeers = rawPeers.filter(p => isAgent(p.name) || p.online);
        displayPeers.sort((a,b) => {
          if (isAgent(a.name) && !isAgent(b.name)) return -1;
          if (!isAgent(a.name) && isAgent(b.name)) return 1;
          return a.name.localeCompare(b.name);
        });

        const chipsEl = document.getElementById('peers-chips');
        if (displayPeers.length) {
          chipsEl.innerHTML = displayPeers.map(p => {
            const roleBadge = isAgent(p.name) ? ' <b style="color:#818cf8;font-size:10px">[агент]</b>' : '';
            return `
              <div class="peer-chip" title="${isAgent(p.name)?'ИИ-агент':'Пользователь'} · ${p.online ? 'в сети' : 'был недавно'}">
                <div class="dot ${p.online ? '' : 'offline'}"></div>
                <span>${esc(p.name)}${roleBadge}</span>
              </div>
            `;
          }).join('');
        } else {
          chipsEl.innerHTML = '<div class="hint-none">Нет участников</div>';
        }

        // Update tasks
        const tasks = stData.tasks || [];
        const openTasks = tasks.filter(t => t.status !== 'done');
        const tasksEl = document.getElementById('tasks-list');
        tasksEl.innerHTML = openTasks.length
          ? openTasks.map(t => `
            <div class="task-card">
              <div class="task-title">
                <span>${esc(t.title || t.id)}</span>
                <span class="badge-status ${t.status}">${t.status}</span>
              </div>
              <div class="task-meta">👤 ${esc(t.owner || t.assignee || 'свободна')} ${t.leaseLeft ? '· ' + t.leaseLeft + 'с' : ''}</div>
            </div>
          `).join('')
          : '<div class="hint-none">Нет открытых задач</div>';

        // Update locks
        const locks = stData.locks || [];
        const locksEl = document.getElementById('locks-list');
        locksEl.innerHTML = locks.length
          ? locks.map(l => `
            <div class="lock-row">
              <span class="lock-agent">${esc(l.agent || l.owner)}</span>: ${esc(l.file)} (${l.expiresIn}с)
            </div>
          `).join('')
          : '<div class="hint-none">Нет блокировок</div>';

      } catch(e) {
        document.getElementById('sb-status').textContent = '🔴 Ошибка связи: ' + e.message;
      }
    }

    async function sendMsg() {
      const inp = document.getElementById('inp');
      const text = inp.value.trim();
      if(!text) return;
      inp.value = '';
      const from = (nameInput.value || 'пантера').trim();

      await fetch(`${HUB}/api/send`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ room: 'main', token: '', from, to: null, type: 'chat', text })
      }).catch(err => alert('Ошибка отправки: ' + err.message));
    }

    connectSSE();
    updateState();
    setInterval(updateState, 2500);
  </script>
</body>
</html>
