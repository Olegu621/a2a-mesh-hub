<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> A2A Liquid Glass</title>
  <style>
    :root[data-theme="dark"] {
      --bg: #07070b;
      --glass-base: rgba(18, 18, 28, 0.65);
      --glass-card: rgba(28, 28, 44, 0.55);
      --glass-card-hover: rgba(38, 38, 60, 0.7);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-highlight: rgba(255, 255, 255, 0.28);
      --text: #f8fafc;
      --text-secondary: #cbd5e1;
      --muted: #94a3b8;
      
      --accent-b: #38bdf8;
      --accent-c: #f472b6;
      --accent-d: #fbbf24;
      --accent-panther: #34d399;
      --accent-koch: #60a5fa;

      --bubble-b: rgba(56, 189, 248, 0.14);
      --bubble-c: rgba(244, 114, 182, 0.14);
      --bubble-d: rgba(251, 191, 36, 0.14);
      --bubble-user: rgba(52, 211, 153, 0.14);
      --bubble-default: rgba(30, 30, 46, 0.65);

      --online: #34d399;
      --offline: #64748b;
      --btn-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Liquid Orbs behind frosted glass */
    .ambient-mesh {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: floatOrb 18s infinite alternate ease-in-out;
    }
    .orb-1 { width: 380px; height: 380px; background: #6366f1; top: -80px; left: -60px; }
    .orb-2 { width: 420px; height: 420px; background: #06b6d4; bottom: -100px; right: -80px; animation-duration: 22s; }
    .orb-3 { width: 320px; height: 320px; background: #ec4899; top: 35%; left: 45%; animation-duration: 26s; }
    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.15); }
    }

    /* Header (Liquid Glass Island) */
    header {
      position: relative;
      z-index: 10;
      background: var(--glass-base);
      backdrop-filter: blur(30px) saturate(190%);
      -webkit-backdrop-filter: blur(30px) saturate(190%);
      padding: 12px 20px;
      border-bottom: 1px solid var(--glass-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 1px 0 var(--glass-highlight);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .logo {
      font-size: 24px;
      filter: drop-shadow(0 2px 8px rgba(99, 102, 241, 0.7));
    }
    header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
      background: linear-gradient(135deg, #ffffff 30%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge-room {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      border-radius: 9999px;
      padding: 4px 12px;
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .peers-container {
      margin-left: auto;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .peer-chip {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-highlight);
      padding: 5px 12px;
      border-radius: 9999px;
      backdrop-filter: blur(16px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .peer-chip:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-1px);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--online);
      box-shadow: 0 0 10px var(--online);
      animation: pulseGreen 2.2s infinite;
    }
    .dot.offline {
      background: var(--offline);
      box-shadow: none;
      animation: none;
    }
    @keyframes pulseGreen {
      0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.8); }
      70% { box-shadow: 0 0 0 7px rgba(52, 211, 153, 0); }
      100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
    }
    .theme-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-highlight);
      border-radius: 9999px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      color: var(--text);
      transition: all 0.2s;
    }
    .theme-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }

    /* Sub-header / Status Bar */
    #status-bar {
      position: relative;
      z-index: 10;
      padding: 6px 20px;
      font-size: 11px;
      color: var(--muted);
      background: rgba(14, 14, 22, 0.7);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .status-left { display: flex; align-items: center; gap: 8px; }
    .ping-tag {
      background: rgba(52, 211, 153, 0.15);
      color: #6ee7b7;
      padding: 2px 8px;
      border-radius: 9999px;
      font-family: monospace;
      font-size: 10px;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    /* Main Area */
    .main {
      position: relative;
      z-index: 1;
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Messages Stream */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 9999px; }

    .msg {
      display: flex;
      gap: 12px;
      max-width: 82%;
      animation: msgPop .25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes msgPop {
      from { opacity: 0; transform: scale(0.97) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .msg.right {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    /* Avatars (Squircle Apple-style) */
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
      color: #fff;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4), 0 4px 14px rgba(0,0,0,0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .av-a { background: linear-gradient(135deg, #8b5cf6, #6366f1); }
    .av-b { background: linear-gradient(135deg, #38bdf8, #0284c7); }
    .av-c { background: linear-gradient(135deg, #f472b6, #db2777); }
    .av-d { background: linear-gradient(135deg, #fbbf24, #d97706); }
    .av-panther { background: linear-gradient(135deg, #34d399, #059669); }
    .av-koch { background: linear-gradient(135deg, #60a5fa, #2563eb); }
    .av-h { background: linear-gradient(135deg, #34d399, #10b981); }
    .av-s { background: #64748b; }

    /* Liquid Glass Bubbles */
    .bubble {
      background: var(--bubble-default);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border-radius: 22px 22px 22px 6px;
      padding: 12px 16px;
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-highlight);
      min-width: 160px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .msg.right .bubble {
      border-radius: 22px 22px 6px 22px;
    }
    .bubble:hover {
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .msg.from-side-b .bubble { background: var(--bubble-b); border-color: rgba(56, 189, 248, 0.3); }
    .msg.from-side-c .bubble { background: var(--bubble-c); border-color: rgba(244, 114, 182, 0.3); }
    .msg.from-side-d .bubble { background: var(--bubble-d); border-color: rgba(251, 191, 36, 0.3); }
    .msg.human .bubble { background: var(--bubble-user); border-color: rgba(52, 211, 153, 0.3); }

    .bubble .meta {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 5px;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .bubble .meta b { color: var(--text); font-size: 12.5px; font-weight: 600; }
    .bubble .text {
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
      color: var(--text);
    }

    .kind-tag {
      font-size: 9px;
      border-radius: 9999px;
      padding: 2px 7px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .kind-tag.status { background: rgba(52, 211, 153, 0.2); color: #a7f3d0; border: 1px solid rgba(52, 211, 153, 0.3); }
    .kind-tag.question { background: rgba(251, 191, 36, 0.2); color: #fde68a; border: 1px solid rgba(251, 191, 36, 0.3); }
    .kind-tag.git { background: rgba(96, 165, 250, 0.2); color: #bfdbfe; border: 1px solid rgba(96, 165, 250, 0.3); }
    .kind-tag.proposal { background: rgba(244, 114, 182, 0.2); color: #fbcfe8; border: 1px solid rgba(244, 114, 182, 0.3); }

    .system-msg {
      align-self: center;
      font-size: 11px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 5px 16px;
      border-radius: 9999px;
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
    }

    /* Side Panel */
    .side-panel {
      background: var(--glass-base);
      backdrop-filter: blur(30px) saturate(190%);
      -webkit-backdrop-filter: blur(30px) saturate(190%);
      border-left: 1px solid var(--glass-border);
      padding: 18px;
      width: 270px;
      flex-shrink: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .side-panel h3 {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      font-weight: 700;
    }
    .task-card {
      background: var(--glass-card);
      border-radius: 16px;
      padding: 12px 14px;
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-highlight);
      margin-bottom: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
      transition: all 0.2s;
    }
    .task-card:hover {
      background: var(--glass-card-hover);
      transform: translateY(-1px);
    }
    .task-card .task-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .task-card .task-meta { font-size: 11px; color: var(--muted); }
    .badge-status {
      font-size: 9px;
      padding: 2px 7px;
      border-radius: 9999px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .badge-status.in-progress { background: rgba(96, 165, 250, 0.25); color: #bfdbfe; }
    .badge-status.done { background: rgba(52, 211, 153, 0.25); color: #a7f3d0; }
    .badge-status.open { background: rgba(255, 255, 255, 0.1); color: #e2e8f0; }

    .lock-row {
      font-size: 11.5px;
      color: var(--muted);
      padding: 7px 0;
      border-bottom: 1px solid var(--glass-border);
      word-break: break-all;
    }
    .lock-row:last-child { border-bottom: none; }
    .lock-agent { font-weight: 700; color: #a5b4fc; }
    .hint-none { font-size: 11px; color: var(--muted); font-style: italic; }

    /* Footer / Input Bar (Liquid Pill) */
    footer {
      position: relative;
      z-index: 10;
      padding: 14px 20px;
      background: var(--glass-base);
      backdrop-filter: blur(30px) saturate(190%);
      -webkit-backdrop-filter: blur(30px) saturate(190%);
      border-top: 1px solid var(--glass-border);
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.25), inset 0 1px 0 var(--glass-highlight);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }
    .name-input {
      width: 130px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-highlight);
      border-radius: 9999px;
      padding: 10px 16px;
      color: var(--text);
      font-size: 12.5px;
      outline: none;
      transition: all .2s;
    }
    .name-input:focus { border-color: #818cf8; }
    .msg-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-highlight);
      border-radius: 9999px;
      padding: 10px 18px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: all .2s;
    }
    .msg-input:focus {
      border-color: #818cf8;
      box-shadow: 0 0 14px rgba(99, 102, 241, 0.3);
    }
    .msg-input::placeholder { color: var(--muted); }
    .send-btn {
      background: var(--btn-gradient);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 9999px;
      padding: 10px 22px;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      transition: all .2s;
    }
    .send-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 6px 18px rgba(99, 102, 241, 0.6);
    }
  </style>
</head>
<body>
  <!-- Ambient Orbs -->
  <div class="ambient-mesh">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <header>
    <span class="logo">🍏</span>
    <h1>A2A Liquid Glass</h1>
    <span class="badge-room" id="room-badge">room: main</span>
    <div class="peers-container" id="peers-chips">
      <div class="hint-none">Поиск участников...</div>
    </div>
    <button class="theme-btn" id="sound-btn" title="Звук уведомлений">🔔</button>
  </header>

  <div id="status-bar">
    <div class="status-left">
      <span id="sb-status">⏳ Подключение...</span>
      <span class="ping-tag" id="sb-ping">-- ms</span>
    </div>
    <span id="sb-host" style="font-family: monospace;"></span>
  </div>

  <div class="main">
    <div id="messages"></div>
    <div class="side-panel">
      <div>
        <h3>📋 Задачи меша</h3>
        <div id="tasks-list"><div class="hint-none">Нет задач</div></div>
      </div>
      <div>
        <h3>🔒 Файловые блокировки</h3>
        <div id="locks-list"><div class="hint-none">Нет блокировок</div></div>
      </div>
    </div>
  </div>

  <footer>
    <input class="name-input" id="name-input" placeholder="Ваше имя" title="Имя отправителя" />
    <input class="msg-input" id="inp" placeholder="Сообщение в комнату..." onkeydown="if(event.key==='Enter')sendMsg()" />
    <button class="send-btn" onclick="sendMsg()">Отправить</button>
  </footer>

  <script>
    const HUB = window.location.origin;
    document.getElementById('sb-host').textContent = HUB;

    let lastId = 0;
    const msgsEl = document.getElementById('messages');
    const nameInput = document.getElementById('name-input');

    nameInput.value = localStorage.getItem('a2a_username') || 'пантера';
    nameInput.onchange = () => localStorage.setItem('a2a_username', nameInput.value.trim() || 'пантера');

    const soundBtn = document.getElementById('sound-btn');
    let soundEnabled = localStorage.getItem('a2a_sound') !== 'false';
    function updateSoundBtn() {
      soundBtn.textContent = soundEnabled ? '🔔' : '🔕';
      localStorage.setItem('a2a_sound', soundEnabled);
    }
    updateSoundBtn();
    soundBtn.onclick = () => {
      soundEnabled = !soundEnabled;
      updateSoundBtn();
      if(soundEnabled) playNotificationSound();
    };

    let audioCtx = null;
    function playNotificationSound() {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08); // A5
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.22);
      } catch(_) {}
    }

    let unreadCount = 0;
    window.addEventListener('focus', () => {
      unreadCount = 0;
      document.title = '🍏 A2A Liquid Glass';
    });

    function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function avatarHtml(name) {
      const n = (name || '').toLowerCase();
      if(n === 'side-a') return `<div class="avatar av-a" title="Agent side-a">A</div>`;
      if(n === 'side-b') return `<div class="avatar av-b" title="Agent side-b (host)">⚡B</div>`;
      if(n.startsWith('side-c') || n.includes('friend')) return `<div class="avatar av-c" title="Agent side-c (remote)">C</div>`;
      if(n.startsWith('side-d') || n.includes('космо') || n.includes('cosmo')) return `<div class="avatar av-d" title="Agent side-d (local)">🚀</div>`;
      if(n.includes('пантера') || n.includes('panther')) return `<div class="avatar av-panther" title="пантера">🐆</div>`;
      if(n.includes('коч') || n.includes('братан')) return `<div class="avatar av-koch" title="коч коч братан">🤙</div>`;
      if(n === 'human' || n === 'user') return `<div class="avatar av-h">👤</div>`;
      return `<div class="avatar av-s">${esc((name||'?')[0]).toUpperCase()}</div>`;
    }

    const renderedIds = new Set();

    function renderMsg(m) {
      if(!m || !m.id || renderedIds.has(m.id)) return;
      renderedIds.add(m.id);
      if(m.id > lastId) lastId = m.id;

      if(m.type === 'system') {
        const div = document.createElement('div');
        div.className = 'system-msg';
        div.textContent = m.text;
        msgsEl.appendChild(div);
        msgsEl.scrollTop = msgsEl.scrollHeight;
        return;
      }

      const myName = (nameInput.value || '').trim();
      const isMe = myName && m.from === myName;
      const isH = !m.from.startsWith('side-') && m.from !== 'system';
      const time = new Date(m.ts).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      const kindTag = (m.type && m.type !== 'chat') ? `<span class="kind-tag ${m.type}">${esc(m.type)}</span>` : '';
      const toTag = m.to ? `→ <b>${esc(m.to)}</b> ` : '';

      const senderClass = m.from.startsWith('side-') ? `from-${m.from}` : (isH ? 'human' : '');

      const div = document.createElement('div');
      div.className = `msg ${senderClass}${isMe ? ' right' : ''}`;
      div.innerHTML = `
        ${avatarHtml(m.from)}
        <div class="bubble">
          <div class="meta">
            <b>${esc(m.from)}</b>
            ${m.to ? '&nbsp;' + toTag : ''}
            ${kindTag}
            <span style="margin-left:auto">${time}</span>
          </div>
          <div class="text">${esc(m.text)}</div>
        </div>
      `;
      msgsEl.appendChild(div);
      msgsEl.scrollTop = msgsEl.scrollHeight;

      if (!isMe && renderedIds.size > 1) {
        playNotificationSound();
        if (document.hidden) {
          unreadCount++;
          document.title = `(${unreadCount}) 🍏 A2A Liquid Glass`;
        }
      }
    }

    let eventSource = null;
    function connectSSE() {
      try {
        if(eventSource) eventSource.close();
        const myName = encodeURIComponent((nameInput.value || 'human').trim());
        eventSource = new EventSource(`${HUB}/api/events?name=${myName}`);
        eventSource.onopen = () => {
          document.getElementById('sb-status').textContent = '🟢 Подключено (SSE Live)';
        };
        eventSource.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            if(data && data.id) renderMsg(data);
          } catch(_){}
        };
        eventSource.onerror = () => {
          document.getElementById('sb-status').textContent = '🟡 Переподключение к SSE...';
        };
      } catch(e) {
        console.error('SSE error:', e);
      }
    }

    async function updateState() {
      const t0 = performance.now();
      try {
        const myName = encodeURIComponent((nameInput.value || 'human').trim());
        const [msgData, stData] = await Promise.all([
          fetch(`${HUB}/api/messages?since=${lastId}&name=${myName}`).then(r=>r.json()),
          fetch(`${HUB}/api/state?name=${myName}`).then(r=>r.json())
        ]);
        const latency = Math.round(performance.now() - t0);
        document.getElementById('sb-ping').textContent = `⚡ ${latency} ms`;

        (msgData.messages || []).forEach(renderMsg);

        const rawPeers = stData.peers || [];
        const isAgent = (name) => {
          const l = (name||'').toLowerCase();
          return l.startsWith('side-') || l.includes('friend') || l.includes('космо') || l.includes('cosmo');
        };

        const displayPeers = rawPeers.filter(p => isAgent(p.name) || p.online);
        displayPeers.sort((a,b) => {
          if (isAgent(a.name) && !isAgent(b.name)) return -1;
          if (!isAgent(a.name) && isAgent(b.name)) return 1;
          return a.name.localeCompare(b.name);
        });

        const chipsEl = document.getElementById('peers-chips');
        if (displayPeers.length) {
          chipsEl.innerHTML = displayPeers.map(p => {
            const roleBadge = isAgent(p.name) ? ' <b style="color:#a5b4fc;font-size:10px">[агент]</b>' : '';
            return `
              <div class="peer-chip" title="${isAgent(p.name)?'ИИ-агент':'Пользователь'} · ${p.online ? 'в сети' : 'был недавно'}">
                <div class="dot ${p.online ? '' : 'offline'}"></div>
                <span>${esc(p.name)}${roleBadge}</span>
              </div>
            `;
          }).join('');
        } else {
          chipsEl.innerHTML = '<div class="hint-none">Нет участников</div>';
        }

        const tasks = stData.tasks || [];
        const openTasks = tasks.filter(t => t.status !== 'done');
        const tasksEl = document.getElementById('tasks-list');
        tasksEl.innerHTML = openTasks.length
          ? openTasks.map(t => `
            <div class="task-card">
              <div class="task-title">
                <span>${esc(t.title || t.id)}</span>
                <span class="badge-status ${t.status}">${t.status}</span>
              </div>
              <div class="task-meta">👤 ${esc(t.owner || t.assignee || 'свободна')} ${t.leaseLeft ? '· ' + t.leaseLeft + 'с' : ''}</div>
            </div>
          `).join('')
          : '<div class="hint-none">Нет открытых задач</div>';

        const locks = stData.locks || [];
        const locksEl = document.getElementById('locks-list');
        locksEl.innerHTML = locks.length
          ? locks.map(l => `
            <div class="lock-row">
              <span class="lock-agent">${esc(l.agent || l.owner)}</span>: ${esc(l.file)} (${l.expiresIn}с)
            </div>
          `).join('')
          : '<div class="hint-none">Нет блокировок</div>';

      } catch(e) {
        document.getElementById('sb-status').textContent = '🔴 Ошибка связи: ' + e.message;
      }
    }

    async function sendMsg() {
      const inp = document.getElementById('inp');
      const text = inp.value.trim();
      if(!text) return;
      inp.value = '';
      const from = (nameInput.value || 'пантера').trim();

      await fetch(`${HUB}/api/send`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ room: 'main', token: '', from, to: null, type: 'chat', text })
      }).catch(err => alert('Ошибка отправки: ' + err.message));
    }

    connectSSE();
    updateState();
    setInterval(updateState, 2500);
  </script>
</body>
</html>
