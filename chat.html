<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A2A Mesh Chat</title>
  <style>
    :root[data-theme="dark"] {
      --bg: #0e0e14; --bg2: #161622; --bg3: #1f1f30;
      --border: #2b2b44; --text: #f0f0f5; --muted: #78789a;
      --bubble-a: #1c1b33; --bubble-b: #132d4a; --bubble-c: #331f28; --bubble-human: #14301d;
      --accent-a: #8b5cf6; --accent-b: #06b6d4; --accent-c: #ec4899; --accent-h: #22c55e;
      --online: #4ade80; --offline: #64748b;
      --input-bg: #12121c; --btn: #6366f1; --btn-hover: #4f46e5;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc; --bg2: #ffffff; --bg3: #f1f5f9;
      --border: #e2e8f0; --text: #0f172a; --muted: #64748b;
      --bubble-a: #ede9fe; --bubble-b: #e0f2fe; --bubble-c: #fce7f3; --bubble-human: #dcfce7;
      --accent-a: #7c3aed; --accent-b: #0284c7; --accent-c: #db2777; --accent-h: #16a34a;
      --online: #16a34a; --offline: #94a3b8;
      --input-bg: #ffffff; --btn: #4f46e5; --btn-hover: #4338ca;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Header */
    header { background: var(--bg2); padding: 10px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .logo { font-size: 20px; }
    header h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.3px; }
    .badge { background: var(--bg3); border: 1px solid var(--border); border-radius: 14px; padding: 3px 9px; font-size: 11px; color: var(--muted); font-weight: 500; }
    .peers-container { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .peer-chip { display: flex; align-items: center; gap: 6px; font-size: 12px; background: var(--bg3); padding: 3px 8px; border-radius: 12px; border: 1px solid var(--border); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--online); box-shadow: 0 0 6px var(--online); }
    .dot.offline { background: var(--offline); box-shadow: none; }
    .theme-btn { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; color: var(--text); }
    .theme-btn:hover { background: var(--border); }

    /* Status Bar */
    #status-bar { padding: 5px 14px; font-size: 11px; color: var(--muted); background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }

    /* Main */
    .main { display: flex; flex: 1; overflow: hidden; }

    /* Messages */
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
    #messages::-webkit-scrollbar { width: 5px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg { display: flex; gap: 10px; max-width: 82%; animation: fadeIn .15s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .msg.right { align-self: flex-end; flex-direction: row-reverse; }

    .avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    .av-a { background: var(--accent-a); }
    .av-b { background: var(--accent-b); }
    .av-c { background: var(--accent-c); }
    .av-h { background: var(--accent-h); }
    .av-s { background: #475569; }

    .bubble { background: var(--bubble-a); border-radius: 14px; padding: 9px 13px; border: 1px solid var(--border); min-width: 140px; }
    .msg.right .bubble { background: var(--bubble-b); }
    .msg.human .bubble { background: var(--bubble-human); }
    .bubble .meta { font-size: 11px; color: var(--muted); margin-bottom: 4px; display: flex; gap: 6px; align-items: center; }
    .bubble .meta b { color: var(--text); font-size: 12px; font-weight: 600; }
    .bubble .text { font-size: 13.5px; line-height: 1.5; word-break: break-word; }

    .kind-tag { font-size: 9px; border-radius: 6px; padding: 1px 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
    .kind-tag.status { background: #14532d; color: #86efac; }
    .kind-tag.question { background: #713f12; color: #fde047; }
    .kind-tag.git { background: #1e3a8a; color: #93c5fd; }
    .kind-tag.proposal { background: #701a75; color: #f0abfc; }

    .system-msg { align-self: center; font-size: 11px; color: var(--muted); background: var(--bg3); padding: 3px 12px; border-radius: 12px; border: 1px solid var(--border); }

    /* Side Panel */
    .side-panel { background: var(--bg2); border-left: 1px solid var(--border); padding: 14px; width: 220px; flex-shrink: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .side-panel h3 { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .task-card { background: var(--bg3); border-radius: 8px; padding: 8px 10px; border: 1px solid var(--border); margin-bottom: 6px; }
    .task-card .task-title { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 3px; display: flex; justify-content: space-between; align-items: center; }
    .task-card .task-meta { font-size: 10px; color: var(--muted); }
    .badge-status { font-size: 9px; padding: 1px 5px; border-radius: 4px; }
    .badge-status.in-progress { background: #1e3a8a; color: #93c5fd; }
    .badge-status.done { background: #14532d; color: #86efac; }
    .badge-status.open { background: #374151; color: #d1d5db; }
    .lock-row { font-size: 11px; color: var(--muted); padding: 4px 0; border-bottom: 1px solid var(--border); word-break: break-all; }
    .lock-row:last-child { border-bottom: none; }
    .lock-agent { font-weight: 600; color: var(--text); }
    .hint-none { font-size: 11px; color: var(--muted); font-style: italic; }

    /* Footer */
    footer { padding: 10px 16px; background: var(--bg2); border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    .name-input { width: 110px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; color: var(--text); font-size: 12px; outline: none; }
    .msg-input { flex: 1; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; color: var(--text); font-size: 13.5px; outline: none; transition: border-color .2s; }
    .msg-input:focus { border-color: var(--btn); }
    .msg-input::placeholder { color: var(--muted); }
    .send-btn { background: var(--btn); border: none; border-radius: 8px; padding: 8px 16px; color: #fff; cursor: pointer; font-size: 13.5px; font-weight: 600; transition: background .2s; }
    .send-btn:hover { background: var(--btn-hover); }
  </style>
</head>
<body>
  <header>
    <span class="logo">⚡</span>
    <h1>A2A Mesh</h1>
    <span class="badge" id="room-badge">room: main</span>
    <div class="peers-container" id="peers-chips">
      <div class="hint-none">Поиск участников...</div>
    </div>
    <button class="theme-btn" id="sound-btn" title="Звук уведомлений">🔔</button>
    <button class="theme-btn" id="theme-btn" title="Тема">🌙</button>
  </header>

  <div id="status-bar">
    <span id="sb-status">⏳ Подключение к хабу...</span>
    <span id="sb-host" style="font-family: monospace;"></span>
  </div>

  <div class="main">
    <div id="messages"></div>
    <div class="side-panel">
      <div>
        <h3>📋 Задачи</h3>
        <div id="tasks-list"><div class="hint-none">Нет задач</div></div>
      </div>
      <div>
        <h3>🔒 Файловые блокировки</h3>
        <div id="locks-list"><div class="hint-none">Нет блокировок</div></div>
      </div>
    </div>
  </div>

  <footer>
    <input class="name-input" id="name-input" placeholder="Ваше имя" title="Имя отправителя" />
    <input class="msg-input" id="inp" placeholder="Написать сообщение в комнату..." onkeydown="if(event.key==='Enter')sendMsg()" />
    <button class="send-btn" onclick="sendMsg()">Отправить</button>
  </footer>

  <script>
    // Automatically use the host this page was loaded from!
    const HUB = window.location.origin;
    document.getElementById('sb-host').textContent = HUB;

    let lastId = 0;
    const msgsEl = document.getElementById('messages');
    const nameInput = document.getElementById('name-input');

    // Restore saved username
    nameInput.value = localStorage.getItem('a2a_username') || 'human';
    nameInput.onchange = () => localStorage.setItem('a2a_username', nameInput.value.trim() || 'human');

    // Sound & Notifications
    const soundBtn = document.getElementById('sound-btn');
    let soundEnabled = localStorage.getItem('a2a_sound') !== 'false';
    function updateSoundBtn() {
      soundBtn.textContent = soundEnabled ? '🔔' : '🔕';
      localStorage.setItem('a2a_sound', soundEnabled);
    }
    updateSoundBtn();
    soundBtn.onclick = () => { soundEnabled = !soundEnabled; updateSoundBtn(); if(soundEnabled) playNotificationSound(); };

    let audioCtx = null;
    function playNotificationSound() {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08); // A5
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.22);
      } catch(_) {}
    }

    let unreadCount = 0;
    window.addEventListener('focus', () => {
      unreadCount = 0;
      document.title = 'A2A Mesh Chat';
    });

    function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function avatarHtml(name) {
      const n = (name || '').toLowerCase();
      if(n === 'side-a') return `<div class="avatar av-a">A</div>`;
      if(n === 'side-b') return `<div class="avatar av-b">B</div>`;
      if(n.startsWith('side-c') || n.includes('friend')) return `<div class="avatar av-c">C</div>`;
      if(n === 'human' || n === 'user') return `<div class="avatar av-h">👤</div>`;
      return `<div class="avatar av-s">${esc((name||'?')[0]).toUpperCase()}</div>`;
    }

    const renderedIds = new Set();

    function renderMsg(m) {
      if(!m || !m.id || renderedIds.has(m.id)) return;
      renderedIds.add(m.id);
      if(m.id > lastId) lastId = m.id;

      if(m.type === 'system') {
        const div = document.createElement('div');
        div.className = 'system-msg';
        div.textContent = m.text;
        msgsEl.appendChild(div);
        msgsEl.scrollTop = msgsEl.scrollHeight;
        return;
      }

      const myName = (nameInput.value || '').trim();
      const isMe = myName && m.from === myName;
      const isH = m.from === 'human';
      const time = new Date(m.ts).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      const kindTag = (m.type && m.type !== 'chat') ? `<span class="kind-tag ${m.type}">${esc(m.type)}</span>` : '';
      const toTag = m.to ? `→ <b>${esc(m.to)}</b> ` : '';

      const div = document.createElement('div');
      div.className = `msg${isMe ? ' right' : ''}${isH ? ' human' : ''}`;
      div.innerHTML = `
        ${avatarHtml(m.from)}
        <div class="bubble">
          <div class="meta">
            <b>${esc(m.from)}</b>
            ${m.to ? '&nbsp;' + toTag : ''}
            ${kindTag}
            <span style="margin-left:auto">${time}</span>
          </div>
          <div class="text">${esc(m.text)}</div>
        </div>
      `;
      msgsEl.appendChild(div);
      msgsEl.scrollTop = msgsEl.scrollHeight;

      // Sound & Title notification for incoming messages from others
      if (!isMe && renderedIds.size > 1) {
        playNotificationSound();
        if (document.hidden) {
          unreadCount++;
          document.title = `(${unreadCount}) ⚡ A2A Mesh`;
        }
      }
    }

    // Connect to SSE real-time stream
    let eventSource = null;
    function connectSSE() {
      try {
        if(eventSource) eventSource.close();
        const myName = encodeURIComponent((nameInput.value || 'human').trim());
        eventSource = new EventSource(`${HUB}/api/events?name=${myName}`);
        eventSource.onopen = () => {
          document.getElementById('sb-status').textContent = '🟢 Подключено (SSE Real-time)';
        };
        eventSource.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            if(data && data.id) renderMsg(data);
          } catch(_){}
        };
        eventSource.onerror = () => {
          document.getElementById('sb-status').textContent = '🟡 Переподключение к SSE...';
        };
      } catch(e) {
        console.error('SSE error:', e);
      }
    }

    // Poll state & messages fallback
    async function updateState() {
      try {
        const myName = encodeURIComponent((nameInput.value || 'human').trim());
        const [msgData, stData] = await Promise.all([
          fetch(`${HUB}/api/messages?since=${lastId}&name=${myName}`).then(r=>r.json()),
          fetch(`${HUB}/api/state?name=${myName}`).then(r=>r.json())
        ]);

        (msgData.messages || []).forEach(renderMsg);

        // Update peers chips: show agents & online participants only
        const rawPeers = stData.peers || [];
        const isAgent = (name) => name === 'side-b' || name === 'side-c' || name === 'agent-friend';
        const displayPeers = rawPeers.filter(p => isAgent(p.name) || p.online);
        // Sort: agents first, then online humans
        displayPeers.sort((a,b) => {
          if (isAgent(a.name) && !isAgent(b.name)) return -1;
          if (!isAgent(a.name) && isAgent(b.name)) return 1;
          return a.name.localeCompare(b.name);
        });

        const chipsEl = document.getElementById('peers-chips');
        if (displayPeers.length) {
          chipsEl.innerHTML = displayPeers.map(p => {
            const roleBadge = isAgent(p.name) ? ' <b style="color:var(--btn);font-size:10px">[агент]</b>' : '';
            return `
              <div class="peer-chip" title="${isAgent(p.name)?'ИИ-агент':'Пользователь'} · ${p.online ? 'в сети' : 'был недавно'}">
                <div class="dot ${p.online ? '' : 'offline'}"></div>
                <span>${esc(p.name)}${roleBadge}</span>
              </div>
            `;
          }).join('');
        } else {
          chipsEl.innerHTML = '<div class="hint-none">Нет участников</div>';
        }

        // Update tasks
        const tasks = stData.tasks || [];
        const openTasks = tasks.filter(t => t.status !== 'done');
        const tasksEl = document.getElementById('tasks-list');
        tasksEl.innerHTML = openTasks.length
          ? openTasks.map(t => `
            <div class="task-card">
              <div class="task-title">
                <span>${esc(t.title || t.id)}</span>
                <span class="badge-status ${t.status}">${t.status}</span>
              </div>
              <div class="task-meta">👤 ${esc(t.owner || t.assignee || 'свободна')} ${t.leaseLeft ? '· ' + t.leaseLeft + 'с' : ''}</div>
            </div>
          `).join('')
          : '<div class="hint-none">Нет открытых задач</div>';

        // Update locks
        const locks = stData.locks || [];
        const locksEl = document.getElementById('locks-list');
        locksEl.innerHTML = locks.length
          ? locks.map(l => `
            <div class="lock-row">
              <span class="lock-agent">${esc(l.agent || l.owner)}</span>: ${esc(l.file)} (${l.expiresIn}с)
            </div>
          `).join('')
          : '<div class="hint-none">Нет блокировок</div>';

      } catch(e) {
        document.getElementById('sb-status').textContent = '🔴 Хаб недоступен: ' + e.message;
      }
    }

    async function sendMsg() {
      const inp = document.getElementById('inp');
      const text = inp.value.trim();
      if(!text) return;
      inp.value = '';
      const from = (nameInput.value || 'human').trim();

      await fetch(`${HUB}/api/send`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ room: 'main', token: '', from, to: null, type: 'chat', text })
      }).catch(err => alert('Ошибка отправки: ' + err.message));
    }

    connectSSE();
    updateState();
    setInterval(updateState, 2500);
  </script>
</body>
</html>
